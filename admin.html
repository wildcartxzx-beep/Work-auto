<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সিস্টেম পোর্টাল - গ্রামীণফোন ও পেমেন্ট কন্ট্রোল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Hind Siliguri', sans-serif;
}

body {
    background: #060e1a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 15px;
}

.card {
    width: 100%;
    max-width: 500px;
    background: rgba(11, 26, 46, 0.95);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid rgba(245, 158, 11, 0.3);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    text-align: center;
}

.title {
    font-size: 20px;
    font-weight: 700;
    color: #fbbf24;
    margin-bottom: 20px;
}

.btn-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.action-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #02060d;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    text-decoration: none;
    display: block;
}

.action-btn:hover {
    opacity: 0.9;
}

.footer-note {
    margin-top: 20px;
    font-size: 13px;
    color: #94a3b8;
}
</style>
</head>
<body>

<div class="card">
    <div class="title">🚀 জিপি ও পেমেন্ট সিস্টেম ড্যাশবোর্ড</div>
    <div class="btn-group">
        <a href="https://www.grameenphone.com" target="_blank" class="action-btn">🌐 গ্রামীণফোন পোর্টাল ওপেন করুন</a>
        <a href="https://sandbox.sslcommerz.com" target="_blank" class="action-btn" style="background: #22c55e; color: white;">💳 এসএসএল পেমেন্ট পেজ ওপেন করুন</a>
    </div>
    <div class="footer-note">
        💡 যেহেতু গ্রামীণফোন সাইট আইফ্রেমে ব্লক করা থাকে, তাই নতুন ট্যাবে ওপেন করে খুব সহজেই ওটিপি নিয়ে কাজ করতে পারবেন।
    </div>
</div>

</body>
</html>
