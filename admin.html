<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সিস্টেম পোর্টাল - গ্রামীণফোন ও পেমেন্ট কন্ট্রোল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Hind Siliguri', sans-serif;
}

body {
    background: #060e1a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
}

.header-container {
    width: 100%;
    max-width: 900px;
    background: rgba(11, 26, 46, 0.95);
    padding: 15px 20px;
    border-radius: 14px;
    border: 1px solid rgba(245, 158, 11, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.title {
    font-size: 18px;
    font-weight: 700;
    color: #fbbf24;
}

.control-buttons {
    display: flex;
    gap: 10px;
}

.nav-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #02060d;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.nav-btn:hover {
    opacity: 0.9;
}

.iframe-container {
    width: 100%;
    max-width: 900px;
    height: 75vh;
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid rgba(245, 158, 11, 0.4);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.footer-note {
    margin-top: 10px;
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
}
</style>
</head>
<body>

<div class="header-container">
    <div class="title">🔗 জিপি ও পেমেন্ট সিস্টেম ড্যাশবোর্ড</div>
    <div class="control-buttons">
        <button class="nav-btn" onclick="loadSite('https://www.grameenphone.com')">গ্রামীণফোন পোর্টাল</button>
        <button class="nav-btn" onclick="loadSite('https://sandbox.sslcommerz.com')">এসএসএল পেমেন্ট পেজ</button>
    </div>
</div>

<div class="iframe-container">
    <!-- ডিফল্টভাবে গ্রামীণফোন ওয়েবসাইট লোড করা থাকবে, যা আপনি পরিবর্তন বা কন্ট্রোল করতে পারবেন -->
    <iframe id="portalFrame" src="https://www.grameenphone.com" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<div class="footer-note">
    💡 এই ফ্রেমের মাধ্যমে আপনি সরাসরি নম্বর ইনপুট এবং ওটিপি (OTP) প্রসেসগুলো মনিটর ও পরিচালনা করতে পারবেন।
</div>

<script>
function loadSite(url) {
    const frame = document.getElementById('portalFrame');
    frame.src = url;
}
</script>

</body>
</html>
